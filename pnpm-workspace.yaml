packages:
  - "apps/*"
  - "packages/*"
# NOT shamefullyHoist: that flattens the whole workspace to one shared
# node_modules, which breaks apps/web (React 18) and apps/mobile (React 19)
# needing different versions of the same peer (react, @tanstack/react-query)
# resolved through packages/hooks, which has no node_modules of its own.
# Metro only actually needs nativewind's own nested dependency hoisted.
publicHoistPattern:
  - "react-native-css-interop"
allowBuilds:
  unrs-resolver: true
minimumReleaseAgeExclude:
  - '@expo/cli@57.0.12'
  - '@expo/router-server@57.0.5'
  - expo-constants@57.0.9
  - expo-modules-core@57.0.9
  - expo@57.0.10
